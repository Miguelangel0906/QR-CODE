<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Vales de Gas LP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link" style="margin-bottom: 20px;">&larr; Volver al Inicio</a>
        <h1>Administración de Vales QR</h1>

        <div class="section">
            <h2>Generación Masiva de Vales</h2>
            <div class="form-group">
                <label for="bulkStationId">Estación de Compra (para todo el lote):</label>
                <input type="text" id="bulkStationId" placeholder="Ej: EstacionA">
            </div>
            <div class="form-group">
                <label for="voucherValidity">Vigencia del Canje (para todo el lote):</label>
                <input type="date" id="voucherValidity">
            </div>
            <div class="form-group">
                <label for="voucherPrefix">Prefijo para ID de Vales:</label>
                <input type="text" id="voucherPrefix" placeholder="Ej: TICKET-">
            </div>
            <div class="form-group-inline">
                <div class="form-group">
                    <label for="startNumber">Número Inicial:</label>
                    <input type="number" id="startNumber" value="1" min="1">
                </div>
                <div class="form-group">
                    <label for="quantity">Cantidad a Generar:</label>
                    <input type="number" id="quantity" value="10" min="1">
                </div>
            </div>
            <button id="generateBulkBtn">Generar Vales Masivamente</button>
        </div>

        <div id="bulkContainer" class="bulk-container" style="display: none;">
            <div class="bulk-header">
                <h2>Vales Generados</h2>
                <button id="downloadBtn">Descargar / Imprimir Vales</button>
            </div>
            <div id="bulkQrCodeContainer" class="grid-container">
                <!-- Los QRs generados masivamente se insertarán aquí -->
            </div>
        </div>

        <div class="section">
            <h2>Vales en el Sistema (Depuración)</h2>
            <ul id="generatedVouchers"></ul>
        </div>
    </div>

    <script src="js/qrcode.min.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
