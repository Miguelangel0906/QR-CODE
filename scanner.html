<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#13223b">
    <title>Escáner de Vales | Gas Express Nieto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-required-role="ayudante">
    <main class="container scanner-shell">
        <div class="app-card">
            <header class="topbar">
                <div class="brand">
                    <span class="brand-mark">N</span>
                    <span class="brand-copy"><strong>GAS EXPRESS NIETO</strong><span>Validación en punto de canje</span></span>
                </div>
                <div class="user-menu">
                    <span class="user-badge"><strong data-user-role>Ayudante</strong><small data-user-email></small></span>
                    <button id="logoutBtn" class="logout-button" type="button">Salir</button>
                </div>
            </header>
            <div class="page-content">
                <div class="page-heading">
                    <span class="eyebrow">Validación en tiempo real</span>
                    <h1>Escáner de vales</h1>
                    <p class="subtitle">Selecciona la estación y coloca el código QR dentro del área de la cámara.</p>
                </div>
                <section class="section">
                    <div class="station-panel">
                        <div class="form-group"><label for="currentStationId">Estación actual</label><input type="text" id="currentStationId" placeholder="Ej. EL SOL" autocomplete="off"></div>
                        <button id="setStationBtn">Iniciar escáner</button>
                    </div>
                    <div class="camera-frame">
                        <video id="reader" playsinline muted></video>
                        <span class="camera-corners" aria-hidden="true"></span>
                    </div>
                    <div id="result" class="scan-result" aria-live="polite"><p class="scanning">Configura la estación para comenzar.</p></div>
                </section>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/scanner.js"></script>
</body>
</html>
